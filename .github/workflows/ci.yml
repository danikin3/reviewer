name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typen, Lint und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Tests
        run: npx vitest run
